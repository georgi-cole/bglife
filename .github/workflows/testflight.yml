name: BgLife iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/art/**'
      - '.github/ios/ExportOptions.plist'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

# New main commits cancel a pending or running deployment. The newest run waits
# for the quiet period, then checks out the latest main revision.
concurrency:
  group: bglife-testflight-main
  cancel-in-progress: true

jobs:
  debounce:
    name: Wait for the merge burst to settle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait 8 minutes after the latest merge
        if: github.event_name == 'push'
        run: sleep 480

  testflight:
    name: Build and upload iOS to TestFlight
    needs: debounce
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    steps:
      - name: Check release credentials
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY APPSTORE_CERTIFICATES_FILE_BASE64 APPSTORE_CERTIFICATES_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing TestFlight environment values: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: pod install --project-directory=mobile/ios

      - name: Import the App Store signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download the App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v7
        with:
          bundle-id: com.georgicole.bglife.playtest
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Locate the generated Xcode workspace
        id: ios-project
        shell: bash
        run: |
          workspace="$(find mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "::error::Expo did not generate an iOS workspace."
            exit 1
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$(basename "$workspace" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Archive the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WORKSPACE: ${{ steps.ios-project.outputs.workspace }}
          SCHEME: ${{ steps.ios-project.outputs.scheme }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/BgLife.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="AppStore com.georgicole.bglife.playtest" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export the App Store IPA
        id: export
        env:
          EXPORT_DIR: ${{ runner.temp }}/bglife-export
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/BgLife.xcarchive" \
            -exportOptionsPlist .github/ios/ExportOptions.plist \
            -exportPath "$EXPORT_DIR"
          ipa="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa" ]; then
            echo "::error::Xcode did not export an IPA."
            exit 1
          fi
          echo "ipa-path=$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload the build to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.export.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'
