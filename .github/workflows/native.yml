name: BgLife native playtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      # The native app imports the shared TypeScript engine and the Tryavna cover.
      - 'src/**/*.ts'
      - '!src/homeScenes.ts'
      - 'public/art/tryavna.webp'
      - '.github/workflows/native.yml'

permissions:
  contents: read

concurrency:
  group: bglife-native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  native-check:
    name: Native compatibility and bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npx expo export --platform all --output-dir "$RUNNER_TEMP/bglife-bundles"

  android:
    name: Android APK and offline smoke
    needs: native-check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: android-package
        with:
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          key: bglife-android-apk-v1-${{ hashFiles('mobile/app.json', 'mobile/index.ts', 'mobile/metro.config.js', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/src/**', 'src/**', 'public/art/**') }}
      - name: Build a standalone, debug-signed APK
        if: steps.android-package.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android
          bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - if: steps.android-package.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.android-package.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: BgLife-Android-Playtest
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - run: bash mobile/e2e/install-maestro.sh
      - name: Update the Android command-line tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;latest'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash mobile/e2e/run-android.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BgLife-Android-Smoke
          path: mobile/smoke-results
          include-hidden-files: true
          retention-days: 7

  ios:
    name: iOS simulator app and smoke
    needs: native-check
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/cache/restore@v4
        id: ios-package
        with:
          path: ${{ runner.temp }}/BgLife-iOS-Simulator.zip
          key: bglife-ios-simulator-v1-${{ hashFiles('mobile/app.json', 'mobile/index.ts', 'mobile/metro.config.js', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/src/**', 'src/**', 'public/art/**') }}
      - if: steps.ios-package.outputs.cache-hit == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bglife-ios/Build/Products/Release-iphonesimulator"
          ditto -x -k "$RUNNER_TEMP/BgLife-iOS-Simulator.zip" "$RUNNER_TEMP/bglife-ios/Build/Products/Release-iphonesimulator"
      - if: steps.ios-package.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: mobile
      - if: steps.ios-package.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install
        working-directory: mobile
      - if: steps.ios-package.outputs.cache-hit != 'true'
        run: pod install --project-directory=ios
        working-directory: mobile
      - name: Build a standalone simulator app
        if: steps.ios-package.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/bglife-ios" CODE_SIGNING_ALLOWED=NO -quiet
          app="$(find "$RUNNER_TEMP/bglife-ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/BgLife-iOS-Simulator.zip"
      - if: steps.ios-package.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/BgLife-iOS-Simulator.zip
          key: ${{ steps.ios-package.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: BgLife-iOS-Simulator
          path: ${{ runner.temp }}/BgLife-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - run: bash mobile/e2e/install-maestro.sh
      - name: Exercise the game in the iOS Simulator
        run: bash mobile/e2e/run-ios.sh
        timeout-minutes: 28
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BgLife-iOS-Smoke
          path: mobile/smoke-results
          include-hidden-files: true
          retention-days: 7
