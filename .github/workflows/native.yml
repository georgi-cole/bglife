name: BgLife native playtest

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to test
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

concurrency:
  group: bglife-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  plan:
    name: Select native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bundles: ${{ steps.select.outputs.bundles }}
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Decide which native jobs are needed
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          changes="$RUNNER_TEMP/native-changes"
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only --no-renames -z "$BASE...$HEAD" > "$changes"
          else
            : > "$changes"
          fi
          plan=$(node .github/scripts/native-check-plan.mjs "$EVENT" "$DRAFT" "$PLATFORM" < "$changes")
          printf '%s\n' "$plan" >> "$GITHUB_OUTPUT"
          printf '### Native checks\n\n```text\n%s\n```\n' "$plan" >> "$GITHUB_STEP_SUMMARY"

  native-check:
    name: Native compatibility and bundles
    needs: plan
    if: needs.plan.outputs.bundles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npx expo export --platform all --output-dir "$RUNNER_TEMP/bglife-bundles"

  android:
    name: Android APK and offline smoke
    needs: [plan, native-check]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: android-package
        with:
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          key: bglife-android-apk-v1-${{ hashFiles('mobile/app.json', 'mobile/index.ts', 'mobile/metro.config.js', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/src/**', 'src/**', 'public/art/**') }}
      - name: Build a standalone, debug-signed APK
        if: steps.android-package.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          cd android
          bash gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64
      - if: steps.android-package.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.android-package.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: BgLife-Android-Playtest
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - run: bash mobile/e2e/install-maestro.sh
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select modern Android SDK command-line tools
        run: |
          tools_dir="$ANDROID_HOME/cmdline-tools"
          "$tools_dir/latest/bin/sdkmanager" --install 'cmdline-tools;22.0'
          # The emulator action prepends the SDK's latest/bin directory to PATH.
          test -x "$tools_dir/22.0/bin/avdmanager"
          mv "$tools_dir/latest" "$RUNNER_TEMP/bglife-preinstalled-cmdline-tools"
          ln -s "$tools_dir/22.0" "$tools_dir/latest"
          "$tools_dir/latest/bin/sdkmanager" --version
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          profile: pixel_7
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash mobile/e2e/run-android.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BgLife-Android-Smoke
          path: mobile/smoke-results
          include-hidden-files: true
          retention-days: 7

  ios:
    name: iOS simulator app and smoke
    needs: [plan, native-check]
    if: needs.plan.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/cache/restore@v4
        id: ios-package
        with:
          path: ${{ runner.temp }}/BgLife-iOS-Simulator.zip
          key: bglife-ios-simulator-v1-${{ hashFiles('mobile/app.json', 'mobile/index.ts', 'mobile/metro.config.js', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/src/**', 'src/**', 'public/art/**') }}
      - if: steps.ios-package.outputs.cache-hit == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bglife-ios/Build/Products/Release-iphonesimulator"
          ditto -x -k "$RUNNER_TEMP/BgLife-iOS-Simulator.zip" "$RUNNER_TEMP/bglife-ios/Build/Products/Release-iphonesimulator"
      - if: steps.ios-package.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: mobile
      - if: steps.ios-package.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install
        working-directory: mobile
      - if: steps.ios-package.outputs.cache-hit != 'true'
        run: pod install --project-directory=ios
        working-directory: mobile
      - name: Build a standalone simulator app
        if: steps.ios-package.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/bglife-ios" CODE_SIGNING_ALLOWED=NO -quiet
          app="$(find "$RUNNER_TEMP/bglife-ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/BgLife-iOS-Simulator.zip"
      - if: steps.ios-package.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/BgLife-iOS-Simulator.zip
          key: ${{ steps.ios-package.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: BgLife-iOS-Simulator
          path: ${{ runner.temp }}/BgLife-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
      - run: bash mobile/e2e/install-maestro.sh
      - name: Exercise the game in the iOS Simulator
        run: bash mobile/e2e/run-ios.sh
        timeout-minutes: 28
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BgLife-iOS-Smoke
          path: mobile/smoke-results
          include-hidden-files: true
          retention-days: 7
