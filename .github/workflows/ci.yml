name: BgLife pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bglife-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  simulation:
    name: Simulation regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Production build and mobile smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bglife-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
