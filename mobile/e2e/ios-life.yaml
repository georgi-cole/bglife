appId: com.georgicole.bglife.playtest
---
- runFlow:
    file: life.yaml
    label: Start a life and advance a year
- runScript: request-ios-restart.js
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 120000
- runFlow:
    file: resume.yaml
    label: Open the same save after a cold restart
    env:
      SAVED_NAME: Mila Vasileva
      SAVED_AGE: "1"
      SCREENSHOT: journal
